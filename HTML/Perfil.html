<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Usuario</title>
  <link rel="stylesheet" href="../CSS/styles.css">
  <link rel="stylesheet" href="../CSS/style_perfil.css">
</head>
<body>

  <!-- ===== Header ===== -->
  <header>
    <div class="logo">
      <h1>Liveness Recognition</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="#">Cursos</a></li>
        <li><a href="#">Contenidos</a></li>
        <li><a href="perfil.html" class="active">Perfil</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== Perfil ===== -->
  <main class="perfil-container">
    <div class="perfil-card">
      <div class="foto-container">
        <img src="../img/avatar.png" alt="Foto de perfil" class="perfil-foto" id="fotoPreview">
        
        <!-- Botón estilizado -->
        <label for="uploadFoto" class="btn-upload">Subir foto</label>
        <input type="file" id="uploadFoto" accept="image/*">
      </div>

      <h2>Juan Pérez</h2>
      <p><strong>Email:</strong> juanperez@example.com</p>
      <p><strong>Rol:</strong> Estudiante</p>
      <p><strong>Miembro desde:</strong> Enero 2025</p>
      <button class="btn">Editar Perfil</button>
    </div>
  </main>

  <script>
    // Vista previa de la imagen cargada
    const uploadInput = document.getElementById("uploadFoto");
    const fotoPreview = document.getElementById("fotoPreview");

    uploadInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          fotoPreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>

</body>
</html>
