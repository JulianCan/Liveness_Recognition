<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="\CSS\formStyles.css">
    <title>Register</title>
</head>
<body>
    <main class="container">
        <!-- Sección de registro -->
        <section class="form-section" id="register-section">
            <header>
                <h1>SOLUTION TECH</h1>
            </header>

            <div class="form-container">
                <h2>REGISTER</h2>
                <form id="register-form">
                    <div class="form-row1">
                        <div class="form-group half-width">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>

                        <div class="form-group half-width">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido" required>
                        </div>
                    </div>

                    <div class="form-row2">
                        <div class="form-group half-width">
                            <label for="institucion">Institución</label>
                            <input type="text" id="institucion" name="institucion" required>
                        </div>

                        <div class="form-group half-width">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" required pattern="\d{1,14}$">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirmar Contraseña</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" name="terms" required> Acepto los términos de servicio
                        </label>
                    </div>

                    <button type="button" id="register-btn">Registrarse</button>
                </form>
            </div>
        </section>

        <!-- Sección de grabación de gesto facial -->
        <section class="form-section" id="gesture-section" style="display: none;">
            <header>
                <h1>SOLUTION TECH - Gesto Facial</h1>
            </header>

            <div class="form-container">
                <h2>Graba tu gesto facial</h2>
                <video id="video" width="100%" height="auto" autoplay></video>
                <button type="button" id="start-recording" onclick="startRecording()">Iniciar Grabación</button>
                <button type="button" id="stop-recording" onclick="stopRecording()" style="display: none;">Detener Grabación</button>
                <input type="hidden" name="video" id="video-input" required>

                <button type="button" id="enviar-registro" onclick="redirectToConfirmation()">Enviar Registro</button>
            </div>
        </section>

        <!-- Imagen a la derecha -->
        <section class="image-container">
            <img src="image.jpg" alt="Imagen del producto" />
        </section>
    </main>
    <script src="\JS\script.js"></script>
</body>
</html>
