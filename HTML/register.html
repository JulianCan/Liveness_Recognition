<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="\CSS\formStyles.css">
    <title>Register</title>
</head>
<body>
    <main class="container">
        <section class="form-section">
            <header>
                <h1>SOLUTION TECH</h1>
            </header>

            <div class="form-container">
                <h2>REGISTER</h2>
                <form action="#" method="POST">
                    <div class="form-row1">
                        <div class="form-group half-width">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>

                        <div class="form-group half-width">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido" required>
                        </div>
                    </div>

                    <div class="form-row2">
                        <div class="form-group half-width">
                            <label for="institucion">Institución</label>
                            <input type="text" id="institucion" name="institucion" required>
                        </div>

                        <div class="form-group half-width">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" required pattern="\d{1,14}$">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirmar Contraseña</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" name="terms" required> Acepto los términos de servicio
                        </label>
                    </div>

                    <button type="submit">Registrarse</button>
                </form>
            </div>
        </section>

        <!-- Imagen a la derecha -->
        <section class="image-container">
            <img src="image.jpg" alt="Imagen del producto" />
        </section>
    </main>
</body>
</html>
